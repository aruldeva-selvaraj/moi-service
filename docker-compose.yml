services:
  db:
    image: postgres:16-alpine
    container_name: moi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-moi_wedding_db}
    volumes:
      - moi_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moi_wedding_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python / FastAPI backend ─────────────────────────────
  api-python:
    profiles: ["python"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moi_api_python
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-moi_wedding_db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Node.js / LoopBack 4 backend ─────────────────────────
  api-node:
    profiles: ["node"]
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: moi_api_node
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_NAME: ${POSTGRES_DB:-moi_wedding_db}
      DB_SSL: "false"
      PORT: 3000
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  moi_pgdata:
