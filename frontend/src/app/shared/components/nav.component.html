<mat-toolbar class="nav-toolbar">
  <div class="nav-brand">
    <span class="nav-logo">🪔</span>
    <span class="nav-title">Moi Manager</span>
  </div>

  <div class="nav-links">
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">
      <mat-icon>dashboard</mat-icon>
      <span class="link-label">Dashboard</span>
    </a>
    <a mat-button routerLink="/events" routerLinkActive="active-link">
      <mat-icon>celebration</mat-icon>
      <span class="link-label">Events</span>
    </a>
    <a mat-button routerLink="/moi" routerLinkActive="active-link">
      <mat-icon>payments</mat-icon>
      <span class="link-label">Moi Entries</span>
    </a>
    <a mat-button routerLink="/reports" routerLinkActive="active-link">
      <mat-icon>bar_chart</mat-icon>
      <span class="link-label">Reports</span>
    </a>
  </div>

  <div class="nav-actions">
    <a mat-raised-button color="accent" routerLink="/events/new" class="new-wedding-btn">
      <mat-icon>add</mat-icon>
      <span class="link-label">New Event</span>
    </a>

    <!-- 5D Theme button -->
    <button mat-icon-button
            class="theme-toggle-btn"
            matTooltip="Theme Studio (5D)"
            matTooltipPosition="below"
            [class.picker-open]="ts.isPickerOpen()"
            (click)="ts.togglePicker()"
            aria-label="Open Theme Studio">
      <mat-icon>palette</mat-icon>
    </button>
  </div>
</mat-toolbar>
