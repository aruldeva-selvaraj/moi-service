<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moify - Smart Digital Wedding Gift Ledger</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    #app-init-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: linear-gradient(135deg, #5a2d0c 0%, #8B4513 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #app-init-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .init-loader-logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    .init-loader-tagline {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    .init-loader-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="mat-typography">
  <div id="app-init-loader">
    <div class="init-loader-logo">💍 Moify</div>
    <div class="init-loader-spinner"></div>
    <div class="init-loader-tagline">Smart Digital Wedding Gift Ledger</div>
  </div>
  <app-root></app-root>
</body>
</html>
