<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moify – Smart Digital Wedding Gift Ledger</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      margin: 0;
      background: #07020F !important;
      background-color: #07020F !important;
      color: rgba(255, 255, 255, 0.82) !important;
    }

    #app-init-loader * { overflow: hidden; }

    /* ── Cinematic init loader ───────────────────────────────── */
    #app-init-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 70% 60% at 20% 15%, rgba(192,68,106,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 85%, rgba(139,26,54,0.28) 0%, transparent 55%),
        radial-gradient(ellipse 80% 70% at 50% 50%, rgba(40,8,30,0.5) 0%, transparent 80%),
        #07020F;
      overflow: hidden;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s;
    }

    #app-init-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Ambient background orbs */
    .il-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0;
      animation: il-orb-in 2s ease forwards;
    }
    .il-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(192, 68, 106, 0.35) 0%, transparent 70%);
      top: -120px; left: -100px;
      animation-delay: 0.2s;
    }
    .il-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
      bottom: -80px; right: -60px;
      animation-delay: 0.5s;
    }
    .il-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(139, 64, 200, 0.18) 0%, transparent 70%);
      top: 40%; left: 60%;
      animation-delay: 0.8s;
    }
    @keyframes il-orb-in {
      to { opacity: 1; }
    }

    /* Floating particles */
    .il-particle {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.7);
      pointer-events: none;
      animation: il-float linear infinite;
    }
    @keyframes il-float {
      0%   { transform: translateY(0) scale(1); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-120vh) scale(0.3); opacity: 0; }
    }

    /* Center wrap */
    .il-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative;
      z-index: 2;
    }

    /* Outer decorative ring */
    .il-rings {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 28px;
    }

    .il-ring-svg {
      position: absolute;
      inset: 0;
    }
    .il-ring-outer {
      animation: il-spin-slow 4s linear infinite;
    }
    .il-ring-mid {
      animation: il-spin-rev 2.5s linear infinite;
    }
    .il-ring-inner {
      animation: il-spin-slow 1.6s linear infinite;
    }

    @keyframes il-spin-slow { to { transform: rotate(360deg); } }
    @keyframes il-spin-rev  { to { transform: rotate(-360deg); } }

    /* Logo inside rings */
    .il-logo-wrap {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #2a0f1f 0%, #1a0a14 100%);
      box-shadow:
        0 0 0 2px rgba(212, 175, 55, 0.3),
        0 0 40px rgba(192, 68, 106, 0.5),
        inset 0 0 20px rgba(0,0,0,0.5);
      animation: il-logo-pulse 2.5s ease-in-out infinite;
    }
    .il-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0;
      animation: il-logo-appear 0.8s 0.6s ease forwards;
    }
    @keyframes il-logo-appear {
      to { opacity: 1; }
    }
    @keyframes il-logo-pulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(212,175,55,0.3), 0 0 40px rgba(192,68,106,0.5), inset 0 0 20px rgba(0,0,0,0.5); }
      50%       { box-shadow: 0 0 0 4px rgba(212,175,55,0.5), 0 0 60px rgba(192,68,106,0.8), inset 0 0 20px rgba(0,0,0,0.5); }
    }

    /* Brand name */
    .il-brand {
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: il-brand-in 0.8s 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes il-brand-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .il-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFD700 0%, #FFF0A0 30%, #E8A0B4 60%, #C0446A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
    }

    .il-tag {
      font-family: 'Inter', Arial, sans-serif;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0;
      animation: il-brand-in 0.8s 1.3s ease forwards;
    }

    /* Progress bar */
    .il-progress {
      width: 160px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 28px;
      overflow: hidden;
      opacity: 0;
      animation: il-brand-in 0.5s 1.5s ease forwards;
    }
    .il-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #C0446A, #FFD700, #C0446A);
      background-size: 200% 100%;
      border-radius: 2px;
      animation: il-progress-anim 1.8s 1.5s ease-out forwards, il-shimmer-bar 1.5s 1.5s linear infinite;
    }
    @keyframes il-progress-anim {
      from { width: 0%; }
      to   { width: 100%; }
    }
    @keyframes il-shimmer-bar {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Sparkle stars around the rings */
    .il-sparkle {
      position: absolute;
      pointer-events: none;
      animation: il-sparkle-anim 2s ease-in-out infinite;
    }
    .il-sparkle::before {
      content: '✦';
      color: rgba(212, 175, 55, 0.8);
      font-size: 12px;
      display: block;
    }
    .il-sparkle:nth-child(1) { top: -8px; left: 50%; animation-delay: 0s; }
    .il-sparkle:nth-child(2) { top: 50%; right: -8px; animation-delay: 0.4s; }
    .il-sparkle:nth-child(3) { bottom: -8px; left: 50%; animation-delay: 0.8s; }
    .il-sparkle:nth-child(4) { top: 50%; left: -8px; animation-delay: 1.2s; }
    .il-sparkle:nth-child(5) { top: 12%; right: 12%; animation-delay: 0.6s; font-size: 8px; }
    .il-sparkle:nth-child(6) { bottom: 12%; left: 12%; animation-delay: 1s; font-size: 8px; }
    @keyframes il-sparkle-anim {
      0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
      50%       { opacity: 1; transform: scale(1.2) rotate(45deg); }
    }

    /* Film grain overlay */
    #app-init-loader::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body class="mat-typography">
  <div id="app-init-loader">
    <!-- Ambient orbs -->
    <div class="il-orb il-orb-1"></div>
    <div class="il-orb il-orb-2"></div>
    <div class="il-orb il-orb-3"></div>

    <!-- Floating gold particles -->
    <div class="il-particle" style="left:10%;bottom:-10px;width:2px;height:2px;animation-duration:8s;animation-delay:0s;"></div>
    <div class="il-particle" style="left:25%;bottom:-10px;width:3px;height:3px;animation-duration:10s;animation-delay:1.5s;"></div>
    <div class="il-particle" style="left:42%;bottom:-10px;width:2px;height:2px;animation-duration:7s;animation-delay:0.8s;"></div>
    <div class="il-particle" style="left:58%;bottom:-10px;width:4px;height:4px;animation-duration:12s;animation-delay:2s;"></div>
    <div class="il-particle" style="left:72%;bottom:-10px;width:2px;height:2px;animation-duration:9s;animation-delay:0.3s;"></div>
    <div class="il-particle" style="left:85%;bottom:-10px;width:3px;height:3px;animation-duration:11s;animation-delay:1.2s;"></div>
    <div class="il-particle" style="left:5%;bottom:-10px;width:2px;height:2px;animation-duration:6s;animation-delay:3s;background:rgba(192,68,106,0.8)"></div>
    <div class="il-particle" style="left:90%;bottom:-10px;width:3px;height:3px;animation-duration:14s;animation-delay:0.6s;background:rgba(192,68,106,0.6)"></div>

    <!-- Center content -->
    <div class="il-center">
      <div class="il-rings">
        <!-- Sparkles -->
        <div class="il-sparkle"></div>
        <div class="il-sparkle"></div>
        <div class="il-sparkle"></div>
        <div class="il-sparkle"></div>
        <div class="il-sparkle"></div>
        <div class="il-sparkle"></div>

        <!-- Outer ring -->
        <svg class="il-ring-svg il-ring-outer" viewBox="0 0 140 140" width="140" height="140" fill="none">
          <circle cx="70" cy="70" r="65" stroke="rgba(212,175,55,0.12)" stroke-width="1"/>
          <circle cx="70" cy="70" r="65"
            stroke="url(#grad-outer)"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-dasharray="40 170"/>
          <defs>
            <linearGradient id="grad-outer" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFD700"/>
              <stop offset="100%" stop-color="#C0446A"/>
            </linearGradient>
          </defs>
        </svg>

        <!-- Mid ring -->
        <svg class="il-ring-svg il-ring-mid" viewBox="0 0 140 140" width="140" height="140" fill="none" style="inset:8px;position:absolute;width:124px;height:124px;">
          <circle cx="62" cy="62" r="57" stroke="rgba(192,68,106,0.15)" stroke-width="1"/>
          <circle cx="62" cy="62" r="57"
            stroke="#C0446A"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="25 135"/>
        </svg>

        <!-- Inner ring -->
        <svg class="il-ring-svg il-ring-inner" viewBox="0 0 140 140" width="140" height="140" fill="none" style="inset:20px;position:absolute;width:100px;height:100px;">
          <circle cx="50" cy="50" r="46" stroke="rgba(212,175,55,0.2)" stroke-width="0.8"/>
          <circle cx="50" cy="50" r="46"
            stroke="#FFD700"
            stroke-width="1"
            stroke-linecap="round"
            stroke-dasharray="15 100"/>
        </svg>

        <!-- Logo -->
        <div class="il-logo-wrap">
          <img src="assets/images/brand-logo.jpeg" alt="Moify" class="il-logo-img">
        </div>
      </div>

      <div class="il-brand">
        <div class="il-name">Moify</div>
      </div>
      <div class="il-tag">Smart Digital Wedding Gift Ledger</div>
      <div class="il-progress">
        <div class="il-progress-bar"></div>
      </div>
    </div>
  </div>

  <app-root></app-root>
</body>
</html>
